<style>

@media(max-width:1100px){.hoy{grid-template-columns:1fr}}

<body>
<header>
  <img src="icons/icon-192.png" alt="CSS">
  <div><h1>Calculadora de Reposición</h1><div class="sub">Caja de Seguro Social · Dirección Nacional de Logística · para las Unidades Ejecutoras</div></div>
  <div class="der"><span class="fr">Saldos al <b id="frS"></b></span><span class="fr">Publicado <b id="frP"></b></span><button class="hbtn" id="btnAyuda">Ayuda y recorrido guiado</button></div>
</header>
<div class="barra">
  <div class="campo"><label for="selUE">Su Unidad Ejecutora</label><select id="selUE" style="min-width:330px"><option value="">Seleccione su unidad…</option></select></div>
  <div class="campo" id="campoBus" style="display:none;flex:1;max-width:420px"><label for="bus">Buscar un renglón de su unidad</label><input type="text" id="bus" placeholder="Código o nombre del renglón"></div>
  <button class="btn" id="btnLimpiar" style="align-self:flex-end">Limpiar filtros</button>
  <button class="btn-volver" id="btnInicio" style="align-self:flex-end;display:none">‹ Todas las unidades</button>
</div>
<main id="main"></main>
<div class="tour-bg" id="tour"><div class="tour-hl" id="tourHl"></div><div class="tour-box" id="tourBox"></div></div>
<div class="modal-bg" id="modal"><div class="modal" role="dialog" aria-modal="true" id="modalC"></div></div>
<script>
(function(){
'use strict';
const BASE='https://torredecontrolcss.github.io/REPOSICION_UE_CSS/';
/* B: mismo formato que usó el dummy aprobado. Se llena por partes:
   al abrir → índice, resumen (73 unidades), catálogo y tránsitos; al elegir unidad → sus 3 archivos. */
const B={ues:{},dic:{},ced:{},tr:{},gen:'',idx:null,res:null,f8idx:{}};
async function traer(f,opcional){ try{ const r=await fetch(BASE+f+'?t='+Date.now()); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }catch(e){ if(opcional) return null; throw new Error(f+': '+e.message); } }
async function cargarUEDatos(u){
  if(B.ues[u]) return B.ues[u];
  const meta=B.idx.ues.find(x=>x.ue===u); if(!meta) throw new Error('Unidad sin datos publicados');
  const [s,f8,co]=await Promise.all([traer(meta.archivo),B.f8idx[u]?traer(B.f8idx[u],true):null,traer(meta.archivo.replace(/^series_saldos_/,'consumo_reportado_'),true)]);
  B.ues[u]={cedis:s.cedis||meta.cedis,fechas:s.fechas,f:(s.f||[]).map(x=>[String(x.c),x.v||[]]),cons:co&&co.c?co.c:null,f8:(f8&&f8.f)||{}};
  return B.ues[u];
}
/* ===== Modelo de reposición (acordado 30-sep-2026, alineado con la Evaluación Técnica del P-240) =====
   d  = mediana de las señales disponibles: consumo observado (bajas del saldo ÷ días CON existencia),
        consumo reportado, requisición F8 (90 d). Consumo observado truncado (>50% del periodo en cero)
        se descarta. Con 2 señales: promedio, salvo efecto presión (F8/otra > 1.5) → se usa la otra.
   L  = 20 días (todo pedido es mensual; norma 15, medido 24).
   SS = Z · σ_d · √L   (Z = 1.65 vitales 95%; 1.28 resto 90%)
   ROP = d·L + SS  (línea amarilla)      Objetivo = d·(L + días a cubrir) + SS            */
const MODELO={L:20, L_NORMA:15, L_MEDIDO:24, CUBRIR:30, VENT:90, Z_VIT:1.65, Z_RES:1.28, PRESION:1.5, CV_DEF:0.5};
const DIA=86400000, dISO=s=>new Date(s+'T00:00:00').getTime();
function senales(serie, fechas, consRep, f8ev, hoyISO){
  const fin=dISO(fechas[fechas.length-1]), ini=fin-MODELO.VENT*DIA;
  const pts=serie.map(([i,v])=>[dISO(fechas[i]),v]);
  const prev=pts.filter(p=>p[0]<ini), w=(prev.length?[prev[prev.length-1]]:[]).concat(pts.filter(p=>p[0]>=ini));
  let baja=0, diasCon=0, diasTot=0; const sem={};
  for(let j=1;j<w.length;j++){
    const dt=Math.round((w[j][0]-Math.max(w[j-1][0],ini))/DIA); if(dt<=0) continue;
    diasTot+=dt; if(w[j-1][1]>0) diasCon+=dt;
    const b=Math.max(0,w[j-1][1]-w[j][1]); baja+=b;
    const k=Math.floor((w[j][0]-ini)/(7*DIA)); if(w[j-1][1]>0) sem[k]=(sem[k]||0)+b;
  }
  // si la serie termina antes de "fin", el último tramo cuenta hasta fin
  if(w.length){ const ult=w[w.length-1]; const dt=Math.round((fin-Math.max(ult[0],ini))/DIA); if(dt>0){ diasTot+=dt; if(ult[1]>0) diasCon+=dt; } }
  const truncado = diasTot>0 && (diasTot-diasCon)/diasTot>0.5;
  const dObs = diasCon>=15 ? baja/diasCon*30 : null;
  const dRep = consRep>0 ? consRep : null;
  let tf8=0; (f8ev||[]).forEach(([f,u,m])=>{ if(dISO(f)>=ini) tf8+=(u||0)+(m||0); });
  const dReq = tf8>0 ? tf8/(MODELO.VENT/30) : null;
  // variabilidad semanal
  const ws=Object.values(sem); let cv=null;
  if(ws.length>=4){ const mu=ws.reduce((a,b)=>a+b,0)/ws.length; if(mu>0){ const sd=Math.sqrt(ws.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(ws.length-1)); cv=sd/mu; } }
  return {dObs,dRep,dReq,truncado,cv,diasCon,diasTot};
}
function demandaBase(s){
  const obs=(s.dObs&&!s.truncado)?s.dObs:null;
  const L=[['obs',obs],['rep',s.dRep],['req',s.dReq]].filter(x=>x[1]>0);
  let d=null, usa='', diag='';
  const presion = s.dReq && (obs||s.dRep) ? s.dReq/(obs||s.dRep) : null;
  if(L.length===3){ const v=L.map(x=>x[1]).sort((a,b)=>a-b); d=v[1]; usa='mediana de las tres señales'; }
  else if(L.length===2){
    if(presion&&presion>MODELO.PRESION){ const o=L.find(x=>x[0]!=='req'); d=o[1]; usa='la otra señal (el F8 está inflado)'; }
    else { d=(L[0][1]+L[1][1])/2; usa='promedio de las dos señales disponibles'; }
  } else if(L.length===1){ d=L[0][1]; usa='la única señal disponible'; }
  const vals=L.map(x=>x[1]);
  if(!L.length) diag='sin';
  else if(s.truncado) diag='truncado';
  else if(presion&&presion>MODELO.PRESION) diag='presion';
  else if(L.length>=2 && Math.max(...vals)/Math.min(...vals)<=1.5) diag='confiable';
  else if(L.length>=2) diag='divergente';
  else diag='una';
  return {d, usa, diag, presion};
}
/* Por recibir = Formas 8 de los últimos L días − lo que ya entró al saldo desde la primera de ellas.
   La subida del saldo es la evidencia de entrega. */
function pendienteF8(serie, fechas, f8ev, L){
  const fin=dISO(fechas[fechas.length-1]), desde=fin-L*DIA;
  const rec=(f8ev||[]).filter(e=>dISO(e[0])>desde); if(!rec.length) return {pend:0,pedido:0,recibido:0,desde:null};
  const pedido=rec.reduce((s,e)=>s+(e[1]||0)+(e[2]||0),0), t0=Math.min(...rec.map(e=>dISO(e[0])));
  let recibido=0; for(let j=1;j<serie.length;j++){ const t=dISO(fechas[serie[j][0]]); if(t>=t0){ const d=serie[j][1]-serie[j-1][1]; if(d>0) recibido+=d; } }
  return {pend:Math.max(0,pedido-recibido),pedido,recibido,desde:t0};
}
function calcularRenglon(saldo, dMes, vital, cv, p){
  const L=p.L, dd=dMes/30, Z=vital?MODELO.Z_VIT:MODELO.Z_RES, cvu=(cv!=null?cv:MODELO.CV_DEF);
  const sdDia=(cvu*7*dd)/Math.sqrt(7);   // σ semanal = cv·(7·d) → σ diario = σ semanal / √7
  const SS=Z*sdDia*Math.sqrt(L), ROP=dd*L+SS, OBJ=dd*(L+p.cubrir)+SS;
  const pedir=Math.max(0,Math.ceil(OBJ-saldo-(p.enCamino||0)));
  let estado;
  if(!(dd>0)) estado='sin';
  else if(saldo<=SS) estado='rojo';
  else if(saldo<=ROP) estado='ambar';
  else if((saldo-ROP)/dd<=7) estado='pronto';
  else estado='verde';
  const diasAROP = dd>0 ? (saldo-ROP)/dd : null;
  return {dd,Z,cv:cvu,cvEst:cv==null,SS,ROP,OBJ,pedir,estado,diasAROP};
}


const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(v)?'·':Math.round(v).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fL=t=>{ const d=new Date(t); return d.getDate()+'-'+MES[d.getMonth()]+'-'+d.getFullYear(); };
const fC=t=>{ const d=new Date(t); return d.getDate()+'-'+MES[d.getMonth()]; };
const nom=c=>(B.dic[c]&&B.dic[c][0])||c, vit=c=>!!(B.dic[c]&&B.dic[c][1]);
const trn=c=>B.tr&&B.tr[c]?{q:B.tr[c][0],f:B.tr[c][1]}:null;

function calcUE(u,p){
  const U=B.ues[u], F=U.fechas, last=F.length-1, fin=dISO(F[last]);
  return U.f.map(([c,v])=>{
    // Serie dispersa: solo guarda los días en que el saldo cambió → último valor conocido.
    const saldo=v.length?v[v.length-1][1]:0;
    let prevSaldo=null; for(let j=v.length-1;j>=0;j--){ if(v[j][0]<=last-1){ prevSaldo=v[j][1]; break; } }
    const s=senales(v,F,U.cons?U.cons[c]:null,U.f8[c]), b=demandaBase(s);
    const pe=pendienteF8(v,F,U.f8[c],p.L);
    const pp={L:p.L,cubrir:p.cubrir,enCamino:pe.pend}, r=b.d?calcularRenglon(saldo,b.d,vit(c),s.cv,pp):{estado:'sin',pedir:0,ROP:0,SS:0,diasAROP:null};
    r.pend=pe.pend; const aj=ajusteDe(u,c); if(aj){ r.pedirSug=r.pedir; r.pedir=aj.pedir; r.aj=aj; }
    if(p.ns&&b.d){ const Z=zDe(p.ns); const dd=b.d/30, sd=((s.cv!=null?s.cv:MODELO.CV_DEF)*7*dd)/Math.sqrt(7); r.SS=Z*sd*Math.sqrt(p.L); r.ROP=dd*p.L+r.SS; r.OBJ=dd*(p.L+p.cubrir)+r.SS; r.pedir=Math.max(0,Math.ceil(r.OBJ-saldo)); r.Z=Z;
      r.estado=saldo<=r.SS?'rojo':saldo<=r.ROP?'ambar':(saldo-r.ROP)/dd<=7?'pronto':'verde'; r.diasAROP=(saldo-r.ROP)/dd; }
    // Nuevo: hoy cambió el saldo y con eso cruzó la línea de pedido.
    const nuevo = (r.estado==='rojo'||r.estado==='ambar') && v.length && v[v.length-1][0]===last && prevSaldo!=null && prevSaldo>r.ROP;
    return {c,v,saldo,prevSaldo,s,b,r,nuevo};
  });
}

  $('modalC').innerHTML='<div class="top"><h2>Cómo funciona la calculadora</h2><button class="btn azul" id="btnTour">▶ Iniciar recorrido guiado</button><button class="btn" id="cerrarM">Cerrar</button></div><div class="cols">'+
  '<h4>La idea</h4><p>Cada renglón tiene una <b>línea de pedido</b>: la cantidad que su unidad consume mientras llega un pedido, más un <b>inventario crítico</b> de protección. Cuando su saldo baja de esa línea, es momento de pedir.</p>'+
  '<h4>1. ¿Cuánto consume?</h4><p>Se miran tres señales: lo que bajó su saldo (sin contar los días en cero), lo que reporta consumir y lo que pide en Formas 8. Ninguna es perfecta, así que se usa la <b>mediana</b> de las tres. Si pide mucho más de lo que consume (<b>efecto presión</b>) o estuvo en cero mucho tiempo (<b>consumo truncado</b>), se le avisa.</p>'+
  '<h4>2. ¿Cuándo pedir?</h4><p>Línea de pedido = demanda diaria × tiempo de entrega + inventario crítico. El tiempo de entrega es <b>20 días</b>: la norma es 15, pero hoy la entrega real tarda 24. El inventario crítico depende de qué tan variable es su consumo y de la criticidad: 95% de nivel de servicio para vitales, 90% para el resto.</p>'+
  '<h4>3. ¿Cuánto pedir?</h4><p>Lo necesario para llegar al <b>nivel objetivo</b>: lo que consumirá mientras llega el pedido, más los días que quiere cubrir (30 por defecto), más el inventario crítico.</p>'+
  '<h4>Los colores</h4><ul><li><b style="color:#c0392b">Crítico</b>: bajo el inventario crítico. Pida ya.</li><li><b style="color:#b7791f">Pedir ya</b>: cruzó la línea de pedido.</li><li><b style="color:#8a6d0b">Pedir pronto</b>: la cruzará en 7 días o menos.</li><li><b style="color:#2e7d32">Con cobertura</b>: sobre la línea.</li></ul>'+
  '<h4>El aviso diario</h4><p>Un solo correo al día por unidad, cuando se cargan los saldos, y solo si tiene renglones bajo la línea de pedido. Marca los que la cruzaron desde la carga anterior.</p></div>';
  $('modal').classList.add('open'); $('cerrarM').onclick=()=>$('modal').classList.remove('open'); $('btnTour').onclick=()=>{ $('modal').classList.remove('open'); iniciarTour(); };
}
/* ---------- recorrido guiado ---------- */
function demoUE(){ if(st.ue) return st.ue; const l=(B.res&&B.res.ues)||[]; const x=l.slice().sort((a,b)=>(b.r+b.a)-(a.r+a.a))[0]; return x?x.ue:B.idx.ues[0].ue; }
function demoR(){ const f=FILAS.filter(x=>x.r.estado==='rojo'||x.r.estado==='ambar').sort((a,b)=>b.r.pedir-a.r.pedir)[0]||FILAS[0]; return f?f.c:''; }
const TOUR=[
 {sel:'.barra',t:'Elija su unidad',x:'Todo empieza aquí. Con la unidad elegida, el buscador de la derecha encuentra un renglón por código o nombre.',prep:()=>{ if(st.ue&&st.cod){ st.cod=''; vistaUE(); } }},
 {sel:'.kpis',t:'Cómo está su unidad hoy',x:'Cada tarjeta cuenta renglones por estado y sirve de filtro: tóquela para ver solo esos. A la derecha, el pre-pedido en Excel. Toque un encabezado de la tabla para ordenar.',prep:async()=>{ const u=demoUE(); if(st.ue!==u||!FILAS.length) await abrirUE(u); st.cod=''; vistaUE(); }},
 {sel:'.tw',t:'Sus renglones, por urgencia',x:'Primero los críticos, luego los que ya cruzaron la línea de pedido. "Pedir" es la cantidad sugerida. Toque un renglón para abrir su calculadora.'},
 {sel:'#hoyRes',t:'Qué hacer hoy',x:'Lo primero en un renglón: si debe pedir, cuánto, cuándo llegaría y hasta cuándo le alcanza. Si hay una orden de compra en camino a CEDIS Panamá, la etiqueta verde junto al nombre lo indica. Con «Descargar imagen» guarda esta vista tal como la ve.',prep:()=>{ st.cod=demoR(); vistaUE(); }},
 {sel:'#p1',t:'1 · Cuánto consume',x:'Tres señales de demanda. Se usa la mediana para que una señal inflada o truncada no desvíe el cálculo. Los signos ? explican cada una.'},
 {sel:'#p2',t:'2 · Línea de pedido',x:'Mueva el tiempo de entrega, los días a cubrir o el nivel de servicio y vea cómo cambian la línea de pedido, el inventario crítico y el nivel objetivo. Solo simula: la lista y el aviso usan los valores institucionales.'},
 {sel:'#graf',t:'La curva',x:'El saldo de su unidad, las franjas verde, amarilla y roja, qué pasa si no pide y si pide hoy, y sus Formas 8 con su propia escala a la derecha. Pase el cursor para ver cada día.'},
 {sel:'#btnVolver',t:'Volver',x:'Regresa a la lista de renglones de su unidad.'}
];
let tourI=0;
function iniciarTour(){ tourI=0; $('tour').classList.add('open'); pasoTour(); }
async function pasoTour(){ const p=TOUR[tourI]; if(p.prep) await p.prep(); const el=document.querySelector(p.sel); if(!el) return cerrarTour();
  if(el.scrollIntoView) el.scrollIntoView({block:'center'});
  setTimeout(()=>{ const r=el.getBoundingClientRect(), hl=$('tourHl'); hl.style.left=(r.left-4)+'px'; hl.style.top=(r.top-4)+'px'; hl.style.width=(r.width+8)+'px'; hl.style.height=(r.height+8)+'px';
    const bx=$('tourBox'); bx.innerHTML='<h4>'+p.t+'</h4><div>'+p.x+'</div><div class="pie"><span class="nota">'+(tourI+1)+' de '+TOUR.length+'</span><span><button class="btn" id="tAnt"'+(tourI?'':' disabled')+'>Anterior</button> <button class="btn azul" id="tSig">'+(tourI===TOUR.length-1?'Terminar':'Siguiente')+'</button> <button class="btn" id="tFin">Salir</button></span></div>';
    const bw=340, top=r.bottom+12+190<window.innerHeight? r.bottom+12 : Math.max(10,r.top-200); bx.style.top=top+'px'; bx.style.left=Math.min(window.innerWidth-bw-10,Math.max(10,r.left))+'px';
    $('tSig').onclick=()=>{ if(tourI===TOUR.length-1) return cerrarTour(); tourI++; pasoTour(); }; $('tAnt').onclick=()=>{ if(tourI){ tourI--; pasoTour(); } }; $('tFin').onclick=cerrarTour; $('tSig').focus(); },60); }
function cerrarTour(){ $('tour').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(!$('tour').classList.contains('open')) return; if(e.key==='Escape') cerrarTour(); if(e.key==='ArrowRight'&&$('tSig')) $('tSig').click(); if(e.key==='ArrowLeft'&&$('tAnt')) $('tAnt').click(); });
/* ---------- controles ---------- */

$('selUE').onchange=e=>{ st.q=''; $('bus').value=''; if(e.target.value) abrirUE(e.target.value); else { st.ue=''; inicio(); } };
$('bus').oninput=e=>{ st.q=e.target.value.trim(); st.cod=''; vistaUE(); };
$('btnInicio').onclick=()=>{ st.ue='';st.cod='';st.q='';st.filtro=''; $('selUE').value=''; $('bus').value=''; inicio(); };
$('btnLimpiar').onclick=()=>{ st.q='';st.filtro='';st.cod=''; $('bus').value=''; if(st.ue) vistaUE(); else inicio(); };
$('btnAyuda').onclick=ayuda;
$('modal').onclick=e=>{ if(e.target.id==='modal') $('modal').classList.remove('open'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('modal').classList.remove('open'); });

window.__rue={st,abrirUE,vistaUE,FILAS:()=>FILAS,iniciarTour,TOUR,B};
(async function arrancar(){
  $('main').innerHTML='<div class="panel nota">Cargando la calculadora…</div>';
  try{
    const [idx,f8i,dic,res]=await Promise.all([traer('series_saldos_index.json'),traer('f8_eventos_index.json',true),traer('renglones_dic.json',true),traer('reposicion_resumen.json',true)]);
    B.idx=idx; B.res=res; if(f8i&&f8i.ues) f8i.ues.forEach(x=>B.f8idx[x.ue]=x.archivo);
    if(dic&&dic.r) Object.keys(dic.r).forEach(k=>B.dic[k]=[dic.r[k].n,dic.r[k].vit?1:0]);
    if(res&&res.tr) B.tr=res.tr;
    B.gen=(res&&res.generado)||idx.generado||'';
    idx.ues.slice().sort((x,y)=>x.ue.localeCompare(y.ue)).forEach(u=>{ const o=document.createElement('option'); o.value=u.ue; o.textContent=u.ue+' ('+u.renglones+' renglones)'; $('selUE').appendChild(o); });
    $('frS').textContent=fL(dISO(idx.fechas[idx.fechas.length-1]));
    $('frP').textContent=B.gen?(new Date(B.gen).toLocaleString('es-PA',{timeZone:'America/Panama',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' PTY'):'·';
    // inventario de los CEDIS (para "le surte…"), en segundo plano
    traer('matriz_snapshot.json',true).then(sn=>{ if(sn&&sn.renglones) sn.renglones.forEach(r=>B.ced[r.c]=[r.iPA||0,r.iDI||0,r.iCH||0]); if(st.cod&&$('hoyRes')) actualizar(); });
    const q=new URLSearchParams(location.search).get('ue');
    if(q&&idx.ues.some(x=>x.ue===q)) abrirUE(q); else inicio();
  }catch(e){ $('main').innerHTML='<div class="panel">No se pudieron cargar los datos ('+esc(e.message)+'). <button class="btn" onclick="location.reload()">Reintentar</button></div>'; }
})();
})();

</script>
